<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet"
   href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <link rel="stylesheet" href="./css/forgot.css">
  </head>
  <style>
    
  </style>
  <body class="forgot-page">
    <div class="forgot-card">
         <div class="logo-box">
         <i class="bi bi-shield-lock-fill"></i>
      </div>
        <h1 class="welcome-text text-center">Reset Password</h1>
          <p class="sub-text text-center">Enter username and new password 🔐</p>
          <!-- form -->
      <form id="forgot-form">
            <!-- username -->
            <div class="input-box mb-3">
             <i class="bi bi-person-fill icon"></i>
            <input type="text"class="form-control" placeholder="Enter Username" id="forgot-user">
         </div>
          <div class="input-box mb-4">
            <i class="bi bi-lock-fill icon"></i>
            <input type="password" class="form-control" placeholder="Enter New Password" id="new-pass">
        </div>
          <button class="btn btn-warning w-100 btn-reset">Reset Password</button>
      </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/forgot.js"></script>

  </body>
</html>

<!doctype html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport"
   content="width=device-width, initial-scale=1.0">
   <title>Order Confirmed</title>
   <!-- Bootstrap -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
   rel="stylesheet">
   <!-- CSS -->
   <link rel="stylesheet" href="./css/stylesheet.css">
</head>
<body class="bg-black text-white">
   <div class="container py-5">
      <div class="order-card text-center mx-auto p-5">
         <!-- Success -->
         <div class="success-icon mb-4">✅</div>
         <h1 class="text-warning fw-bold">Order Confirmed!</h1>
         <p class="mt-3">Your delicious food is on the way 😎</p>
         <p class="text-warning">Estimated Delivery: 30 Minutes</p>
         <hr>
         <!-- Tracking -->
         <div class="tracking mt-5">
            <div class="track-step active">✔ Order Placed</div>
            <div class="track-step active">👨‍🍳 Preparing Food</div>
            <div class="track-step">🛵 Out For Delivery</div>
            <div class="track-step">🎉 Delivered</div>
         </div>
         <!-- Button -->
         <a href="index.html" class="btn btn-warning mt-5 fw-bold px-5">Back To Home</a>
      </div>
   </div>
</body>
</html>

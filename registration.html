<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/registration.css">
</head>

<body class="register-page">

   <div class="register-card">

      <!-- LOGO -->
      <div class="logo-box">
         <i class="bi bi-cup-hot-fill"></i>
      </div>

      <!-- HEADING -->
      <h1 class="welcome-text text-center">
         Create Account
      </h1>

      <p class="sub-text text-center">
         Join FoodieHub and enjoy delicious food 🍔
      </p>

      <!-- FORM -->
      <form id="register-form">

         <!-- USERNAME -->
         <div class="input-box mb-3">

            <i class="bi bi-person-fill icon"></i>

            <input
               type="text"
               class="form-control"
               placeholder="Enter Username"
               id="reg-user"
            >

         </div>

         <!-- EMAIL -->
         <!-- <div class="input-box mb-3">

            <i class="bi bi-envelope-fill icon"></i>

            <input
               type="email"
               class="form-control"
               placeholder="Enter Email"
               id="reg-email"
            >

         </div> -->

         <!-- PASSWORD -->
         <div class="input-box mb-3">

            <i class="bi bi-lock-fill icon"></i>

            <input
               type="password"
               class="form-control"
               placeholder="Create Password"
               id="reg-pass"
            >

         </div>

         <!-- CONFIRM PASSWORD -->
         <div class="input-box mb-4">

            <i class="bi bi-shield-lock-fill icon"></i>

            <input
               type="password"
               class="form-control"
               placeholder="Confirm Password"
               id="confirm-pass"
            >

         </div>

         <!-- BUTTON -->
         <button class="btn btn-warning w-100 btn-register">

            Create Account

         </button>

         <!-- LOGIN LINK -->
         <p class="bottom-text text-center">

            Already have an account?

            <a href="login.html">

               Login

            </a>

         </p>

      </form>

   </div>

   <script src="./js/registration.js"></script>
   <!-- <div class="toast"></div> -->

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="./css/stylesheet.css">
</head>
<body>

  <div class="container-fluid login-page d-flex justify-content-center align-items-center">
    <!-- Main Card -->
    <div class="card main-card border-2 border-secondary">
      <div class="row g-0">
        <!-- Left Image -->
        <div class="col-md-6 image-side">
          <img
            src="./images/login-img.png"
            alt="login image"
            class="img-fluid login-image">
          <!-- Happy Customers -->
          <div class="customer-box">
            <div class="customer-imgs d-flex">
              <img src="https://i.pravatar.cc/100?img=1">
              <img src="https://i.pravatar.cc/100?img=2">
              <img src="https://i.pravatar.cc/100?img=3">
            </div>
            <div class="customer-text">
              <h5>2500+ Happy Customers</h5>
              <div class="stars">
                ★★★★★
                <span class="text-white">
                  4.8/5
                </span>
              </div>
            </div>
          </div>
        </div>
        <!-- Right Form -->
        <div class="col-md-6">
          <div class="login-content">
            <!-- Logo -->
            <div class="logo-box">
              <i class="bi bi-cup-hot-fill"></i>
            </div>
            <!-- Heading -->
            <h1 class="welcome-text text-center">
              Welcome Back 👋
            </h1>
            <p class="sub-text text-center">
              Login to continue your food journey
            </p>
            <!-- Form -->
            <form onsubmit="login(event)">
              <!-- Email -->
              <div class="mb-3 input-box">
                <i class="bi bi-person-fill icon"></i>
                <input
                  type="text"
                  id="user"
                  class="form-control"
                  placeholder="Enter your username">
              </div>
              <!-- Password -->
              <div class="mb-3 input-box">
                <i class="bi bi-lock-fill icon"></i>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Enter your password">
              </div>
              <!-- Remember -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox">
                  <label class="form-check-label">
                    Remember me
                  </label>
                </div>
                <a href="forgot.html"
                  class="text-warning text-decoration-none">
                  Forgot Password?
                </a>
              </div>
              <!-- Login Button -->
              <button type="submit" class="btn btn-warning w-100 btn-login">
                Login
              </button>
              <!-- Register -->
              <p class="text-center text-white mt-4 mb-0">
                Don't have an account?
                <a href="./registration.html"
                  class="text-warning text-decoration-none fw-bold">
                  Register
                </a>
              </p>
            </form>
            <!-- <div id="errorMsg" class="alert alert-danger bg-danger text-light mt-3 d-none" role="alert">
              Invalid Username or Password
            </div> -->
          </div>
        </div>
      </div>
    </div>
  </div>
  
  
  <script>

    let user = localStorage.getItem('username')
    let pass = localStorage.getItem('password')
function login(event){
   event.preventDefault()
   let username = document.querySelector('#user').value
   let password = document.querySelector('#password').value
   let loginToast = document.getElementById("login-toast")
   // SUCCESS
   if(username === user && password === pass){
      loginToast.innerText = "Login Successful ✅"
      loginToast.classList.add("show","success")
      setTimeout(()=>{
         window.location.href = "index.html"
      },1000)
   }
   // ERROR
   else{
      loginToast.innerText = "Invalid Username or Password ❌"
      loginToast.classList.add("show","error")
      setTimeout(()=>{
         loginToast.classList.remove("show","error")
      },3000)
   }
}
  </script>
<div id="login-toast"></div>
</body>
</html>

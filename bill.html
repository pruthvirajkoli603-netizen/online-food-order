<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/stylesheet.css">
  </head>
  <body class="bg-black text-white">
    <div class="container py-5">
        <div class="bill-card mx-auto p-4">
            <div class="text-center">
                <h1 class="text-warning fw-bold">🍔 FoodieHub </h1>
                <p>Order Receipt</p>
            </div>
            <div>
            </div>
            <hr>
            <!-- Order Info -->
            <div class="d-flex justify-content-between">
                <p>Order ID:</p>
                <p>#45879</p>
            </div>
            <div class="d-flex justify-content-between">
                 <p> Date:</p>
                <p id="date"></p>
            </div>
            <hr>
            <div id="bill-items">
            </div>
        </div>
        <hr>
         <div class="d-flex justify-content-between">
            <p>Total</p>
            <p>₹<span id="subtotal">0</span></p>
         </div>
         <div class="d-flex justify-content-between">
            <p>GST (5%)</p>
            <p>₹<span id="gst">0</span></p>
         </div>
         <div class="d-flex justify-content-between">
            <p>Delivery Fee</p>
            <p>₹40</p>
         </div>
         <hr>
         <!-- Total -->
         <div class="d-flex justify-content-between">
            <h4>Grand Total</h4>
           <h4 class="text-warning">
              ₹<span id="final-total">0</span>
           </h4>
         </div>
         <!-- Button -->
         <button id="print-btn"
          class="btn btn-warning w-100 mt-4 fw-bold">
            Print Bill
         </button>
         <a href="order.html" class="btn btn-light w-100 mt-3 fw-bold">Place Order</a>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>

let cartData = JSON.parse(localStorage.getItem("cartData"))
let billItems = document.getElementById("bill-items")
let subtotal = 0
cartData.forEach((item)=>{
   subtotal += Number(item.price)
   billItems.innerHTML += `

   <div class="d-flex justify-content-between">

      <p>${item.name}</p>

      <p>₹${item.price}</p>

   </div>

   `

})


// SUBTOTAL

document.getElementById("subtotal").innerText = subtotal


// GST

let gst = (subtotal * 0.05).toFixed(2)

document.getElementById("gst").innerText = gst


// FINAL TOTAL

// let total = subtotal + gst + 40
let total = subtotal + Number(gst) + 40

let today=new Date()

document.getElementById("date").innerText=today.toLocaleDateString()

document.getElementById("final-total").innerText = total

let printBtn = document.getElementById("print-btn")

printBtn.addEventListener("click",()=>{

   window.print()

})

</script>
  </body>
</html>
